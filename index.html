<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thruphysics</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #8B0000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 500px;
            background: linear-gradient(to bottom, #cc0000, #990000);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .button-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .icon-btn {
            width: 90px;
            height: 90px;
            background: linear-gradient(to bottom, #ff3333, #cc0000);
            border: 2px solid #ff6666;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .icon-btn:hover {
            filter: brightness(1.1);
        }
        .icon-btn:active {
            transform: scale(0.96);
        }
        .icon-btn.disabled {
            cursor: default;
            opacity: 0.9;
        }
        .icon-btn img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }
        .welcome-box {
            background: linear-gradient(to bottom, #cccccc, #999999);
            border: 1px solid #777;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 15px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.6);
        }
        .atom-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(to bottom, #ff3333, #990000);
            border: 2px solid #ff6666;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4);
            overflow: hidden;
        }
        .atom-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .welcome-text {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="button-row">
            <!-- 1. Advanced Button (Active) -->
            <a href="amode.html" class="icon-btn" title="amode">
                <img src="amode.png" alt="amode">
            </a>

            <!-- 2. Sandbox Button (Disabled) -->
            <div class="icon-btn disabled" title="Sandbox">
                <img src="Sandbox.png" alt="Sandbox">
            </div>

            <!-- 3. GitHub Button (Active) -->
            <a href="https://github.com/noellekde/thruphysics/" target="_blank" rel="noopener noreferrer" class="icon-btn" title="GitHub">
                <img src="github.png" alt="GitHub">
            </a>

            <!-- 4. LinkedIn Button (Active) -->
            <a href="https://linkedin.com/in/noelle-kade-397aa7433/" target="_blank" rel="noopener noreferrer" class="icon-btn" title="LinkedIn">
                <img src="image.png" alt="LinkedIn">
            </a>
        </div>

        <div class="welcome-box">
            <div class="atom-icon">
                <img src="announcementicon.jpg" alt="Announcement Icon">
            </div>
            <div class="welcome-text">
                Welcome to Thruphysics. Click a button above to get sent to the page.
            </div>
        </div>
    </div>
</body>
</html>
