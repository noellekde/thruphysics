<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thruphysics - Advanced Math Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #8B0000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 720px;
            background: linear-gradient(to bottom, #cc0000, #990000);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, #cccccc, #999999);
            border: 1px solid #777;
            border-radius: 4px;
            padding: 10px 15px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.6);
        }
        .back-btn {
            background: linear-gradient(to bottom, #ff3333, #cc0000);
            border: 2px solid #ff6666;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4);
        }
        .back-btn:hover {
            filter: brightness(1.1);
        }
        .title {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        }
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .pane {
            background: linear-gradient(to bottom, #e6e6e6, #b3b3b3);
            border: 1px solid #777;
            border-radius: 4px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.6);
        }
        .pane-label {
            color: #333;
            font-weight: bold;
            font-size: 13px;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: #1e1e1e;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 8px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        canvas {
            width: 100%;
            height: 180px;
            background-color: #000;
            border: 1px solid #444;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: linear-gradient(to bottom, #ff3333, #cc0000);
            border: 2px solid #ff6666;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4), 0 2px 5px rgba(0,0,0,0.3);
        }
        .action-btn:hover {
            filter: brightness(1.1);
        }
        .action-btn:active {
            transform: scale(0.96);
        }
        .status-text {
            color: #fff;
            font-size: 13px;
            font-style: italic;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <a href="index.html" class="back-btn">&larr; Home</a>
            <div class="title">Advanced Calculation Mode (amode)</div>
        </div>

        <div class="workspace">
            <div class="pane">
                <span class="pane-label">Manual Physics / Math Equations</span>
                <textarea id="calcInput">v += 9.81 * dt;
y += v * dt;
if (y > 140) {
    y = 140;           
    v = -v * 0.75;     
}</textarea>
            </div>

            <div class="pane">
                <span class="pane-label">Frame Render View</span>
                <canvas id="renderCanvas" width="330" height="180"></canvas>
            </div>
        </div>

        <div class="controls-row">
            <button class="action-btn" id="runBtn">Run Simulation</button>
            <span class="status-text" id="statusMsg">Status: Ready</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const runBtn = document.getElementById('runBtn');
        const statusMsg = document.getElementById('statusMsg');
        const calcInput = document.getElementById('calcInput');

        let animId = null;

        runBtn.addEventListener('click', () => {
            if (animId) cancelAnimationFrame(animId);
            statusMsg.textContent = "Status: Calculating frame-by-frame...";

            let userMathCode = calcInput.value;
            let t = 0;
            let y = 20;
            let v = 0;
            let dt = 0.05;

            function frameLoop() {
                try {
                    let stepMath = new Function('y', 'v', 't', 'dt', `
                        ${userMathCode}
                        return { y: typeof y !== 'undefined' ? y : 20, v: typeof v !== 'undefined' ? v : 0 };
                    `);

                    let res = stepMath(y, v, t, dt);
                    y = res.y;
                    v = res.v;
                    t += dt;

                    ctx.fillStyle = "#111";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.strokeStyle = "#222";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for(let x = 0; x < canvas.width; x += 30) {
                        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
                    }
                    for(let yLine = 0; yLine < canvas.height; yLine += 30) {
                        ctx.moveTo(0, yLine); ctx.lineTo(canvas.width, yLine);
                    }
                    ctx.stroke();

                    let renderX = canvas.width / 2;
                    let renderY = y;

                    ctx.fillStyle = "#00ffcc";
                    ctx.beginPath();
                    ctx.arc(renderX, renderY, 8, 0, Math.PI * 2);
                    ctx.fill();

                    animId = requestAnimationFrame(frameLoop);
                } catch(e) {
                    statusMsg.textContent = "Math calculation syntax error!";
                    console.error(e);
                }
            }

            frameLoop();
        });
    </script>
</body>
</html>
